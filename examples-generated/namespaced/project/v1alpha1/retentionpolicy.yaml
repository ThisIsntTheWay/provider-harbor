apiVersion: project.harbor.m.crossplane.io/v1alpha1
kind: RetentionPolicy
metadata:
  annotations:
    meta.upbound.io/example-id: project/v1alpha1/retentionpolicy
  labels:
    testing.upbound.io/example-name: main
  name: main
  namespace: upbound-system
spec:
  forProvider:
    rule:
    - nDaysSinceLastPull: 5
      repoMatching: '**'
      tagMatching: latest
    - nDaysSinceLastPush: 10
      repoMatching: '**'
      tagMatching: '{latest,snapshot}'
    schedule: Daily
    scopeSelector:
      matchLabels:
        testing.upbound.io/example-name: main

---

apiVersion: project.harbor.m.crossplane.io/v1alpha1
kind: Project
metadata:
  annotations:
    meta.upbound.io/example-id: project/v1alpha1/retentionpolicy
  labels:
    testing.upbound.io/example-name: main
  name: main
  namespace: upbound-system
spec:
  forProvider:
    name: acctest
