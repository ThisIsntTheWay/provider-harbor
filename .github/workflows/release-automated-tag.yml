---
# Inspiration: https://github.com/rossigee/provider-harbor

name: Automated release on tag

on:
  push:
    tags:
      - 'v*'

env:
  GO_VERSION: '1.25.9'

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Vendor Dependencies
        run: |
          go mod vendor
          make vendor.check

      - name: Init build submodule
        run: git submodule update --init --depth 1 build

      - name: Extract Version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Normalize Registry Owner
        id: owner
        run: echo "owner_lc=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build
        run: make build BUILD_PLATFORMS="linux_amd64 linux_arm64"
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Build Crossplane Packages
        run: make xpkg.build BUILD_PLATFORMS="linux_amd64 linux_arm64"
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Publish Artifacts (Docker Images + Crossplane Packages)
        run: |
          make publish \
            REGISTRY_ORGS="ghcr.io/${{ steps.owner.outputs.owner_lc }}" \
            XPKG_REG_ORGS="ghcr.io/${{ steps.owner.outputs.owner_lc }}" \
            BRANCH_NAME=master
        env:
          VERSION: ${{ steps.version.outputs.version }}
